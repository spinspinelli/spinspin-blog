<?xml version="1.0" encoding="UTF-8"?>
<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Inner shadow effect -->
    <filter id="innerShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.2"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Drop shadow effect -->
    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.2"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main knob circle with gray fill -->
  <circle cx="50" cy="50" r="40" fill="#d1d5db" filter="url(#dropShadow)"/>
  
  <!-- Dark border ring -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="#1a1a1a" stroke-width="9"/>
  
  <!-- Inner shadow overlay -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="2"/>
  
  <!-- Black indicator line -->
  <rect x="47" y="5" width="6" height="25" rx="3" fill="#1a1a1a"/>
</svg>
